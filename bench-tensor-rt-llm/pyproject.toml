[project]
name = "bench-tensorrt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
authors = [{ name = "whatphilipcodes", email = "gerdes.philip@gmail.com" }]
dependencies = [
  "etcd3",
  "flashinfer",
  "s2wrapper",
  "tensorrt-llm>=1.3.0rc25",
  "torch>=2.12.0,<2.13.0",
  "torchao<0.15.0",
  "torchaudio",
  "torchcodec>=0.16.0",
  "torchvision",
]

[project.scripts]
bench-tensorrt = "bench_tensorrt:main"

[dependency-groups]
dev = [
  "ruff>=0.16.2",
  "ty>=0.0.70",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
override-dependencies = ["triton==3.7.0", "transformers>=5.16.1"]

[tool.uv.sources]
torch = { index = "torch" }
torchcodec = { index = "torch" }
torchaudio = { index = "torch" }
torchvision = { index = "torch" }
tensorrt_llm = { index = "nvidia" }
etcd3 = { git = "https://github.com/kragniz/python-etcd3.git", rev = "e58a899579ba416449c4e225b61f039457c8072a" }
flashinfer = { git = "https://github.com/flashinfer-ai/flashinfer.git", rev = "06309c4e" }
s2wrapper = { git = "https://github.com/bfshi/scaling_on_scales.git", rev = "60da2afe" }

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true
