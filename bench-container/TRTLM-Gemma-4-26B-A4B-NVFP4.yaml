x-shared: &shared
  extends:
    file: all-base.yaml
    service: base
    
  container_name: TRTLM-Gemma-4-26B-A4B-NVFP4
  image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc26.dev202609050001
  entrypoint: ["trtllm-serve", "serve"]
  command: >
    nvidia/gemma-4-26B-A4B-NVFP4
    --host 0.0.0.0
    --port 8000
    --trust_remote_code
    --max_seq_len 8192
    --extra_llm_api_options /opt/trtllm-config.yaml
  configs:
    - source: trtllm_api_config
      target: /opt/trtllm-config.yaml

services:
  spark:
    <<: *shared
    environment:
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - /opt/huggingface_cache/hub:/root/.cache/huggingface/hub

  wsl:
    <<: *shared
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    volumes:
      - /home/philip/.cache/huggingface/hub:/root/.cache/huggingface/hub

configs:
  trtllm_api_config:
    content: |
      max_batch_size: 16
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.80
      moe_config:
        backend: CUTLASS
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 16
      disable_overlap_scheduler: true