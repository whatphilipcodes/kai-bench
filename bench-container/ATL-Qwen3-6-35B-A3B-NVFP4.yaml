x-shared: &shared
  extends:
      file: all-base.yaml
      service: base
      
  container_name: ATL-Qwen3-6-35B-A3B-NVFP4
  image: avarok/atlas-gb10:latest
  command: >
    serve Sehyo/Qwen3.5-35B-A3B-NVFP4
    --bind 0.0.0.0
    --port 8000
    --max-seq-len 65536
    --kv-cache-dtype fp8
    --kv-high-precision-layers auto
    --gpu-memory-utilization 0.90
    --scheduling-policy slai
    --enable-prefix-caching
    --speculative
    --tool-call-parser qwen3_coder
    --oom-guard-mb 8192
    
services:
  spark:
    <<: *shared
    environment:
      - CUTE_DSL_ARCH=sm_121a
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - /opt/huggingface_cache/hub:/root/.cache/huggingface/hub

  wsl:
    <<: *shared
    volumes:
      - /home/philip/.cache/huggingface/hub:/root/.cache/huggingface/hub