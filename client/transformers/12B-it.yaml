schemaVersion: "2.0"

benchmark:
  model: "google/gemma-4-12B-it"
  tokenizer:
    name: "google/gemma-4-12B-it"
  
  endpoint:
    type: "chat"
    url: "http://localhost:8000"
    streaming: false
    
  dataset:
    type: "synthetic"
    prompts:
      isl:
        mean: 16
      osl:
        mean: 10
        
  phases:
    - name: "profiling"
      type: "concurrency"
      concurrency: 1
      requests: 2
        
  artifacts:
    dir: "./12B-it"