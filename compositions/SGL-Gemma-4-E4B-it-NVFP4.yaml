x-shared: &shared
  extends:
      file: all-base.yaml
      service: base

  container_name: SGL-Gemma-4-E4B-it-NVFP4
  image: lmsysorg/sglang:latest-cu130
  entrypoint: ["sglang", "serve"]
  command: >
    unsloth/gemma-4-E4B-it-NVFP4
    --host 0.0.0.0
    --port 8000
    --mem-fraction-static 0.2
    --cuda-graph-max-bs-decode 8
    --max-running-requests 2
    --context-length 32768
    --chunked-prefill-size 4096
    --speculative-algorithm NEXTN
    --speculative-num-steps 3
    --speculative-eagle-topk 1
    --speculative-num-draft-tokens 4

services:
  spark:
    <<: *shared
    environment:
      - CUTE_DSL_ARCH=sm_121a
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - /opt/huggingface_cache/hub:/root/.cache/huggingface/hub

  wsl:
    <<: *shared
    volumes:
      - /home/philip/.cache/huggingface/hub:/root/.cache/huggingface/hub