x-shared: &shared
  extends:
      file: all-base.yaml
      service: base

  container_name: SGL-Gemma-12B-it
  image: lmsysorg/sglang:nightly-cu134
  entrypoint: ["sglang", "serve"]
  command: >
    unsloth/Qwen3.8-27B-NVFP4
    --host 0.0.0.0
    --port 8000
    
services:
  spark:
    <<: *shared
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - /opt/huggingface_cache/hub:/root/.cache/huggingface/hub
      
  wsl:
    <<: *shared
    volumes:
      - /home/philip/.cache/huggingface/hub:/root/.cache/huggingface/hub