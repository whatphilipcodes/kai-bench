x-shared: &shared
  extends:
    file: all-base.yaml
    service: base
    
  container_name: TRTLLM-Gemma-4-12B-it
  image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc28
  entrypoint: ["trtllm-serve"]
  command: >
    google/gemma-4-12B-it
    --host 0.0.0.0
    --port 8000
    --extra_llm_api_options /opt/gemma-fix.yaml
  configs:
    - source: gemma-fix
      target: /opt/gemma-fix.yaml

services:
  spark:
    <<: *shared
    volumes:
      - /opt/huggingface_cache/hub:/root/.cache/huggingface/hub
      
  wsl:
    <<: *shared
    volumes:
      - /home/philip/.cache/huggingface/hub:/root/.cache/huggingface/hub

configs:
  gemma-fix:
    content: |
      attn_backend: FLASHINFER